services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    # Der Port 3000 wird an 127.0.0.1 gebunden, damit er nur lokal (für Nginx) 
    # und nicht direkt aus dem Internet erreichbar ist.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ../backend:/usr/src/app
      - api_node_modules:/usr/src/app/node_modules
      - ../public/uploads:/usr/src/app/uploads
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', r=>process.exit(r.statusCode===200?0:1)).on('error', ()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Port nach außen schließen, da die API intern über den Service-Namen "db" zugreift
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    restart: unless-stopped
    # Adminer ebenfalls nur lokal binden oder über Nginx-Subdomain absichern
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  api_node_modules:
