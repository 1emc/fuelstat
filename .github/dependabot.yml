# Wöchentliche Updates für die Node-API; kleine Updates gesammelt in einem PR, damit es übersichtlich bleibt.
# Sicherheitsupdates kommen unabhängig davon sofort (Einstellung „Dependabot security updates“).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      kleine-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
